# XcodeGen spec for the NosoDeck iPhone app (PRD §5).
# Generate with:  cd apps/NosoDeck && xcodegen
# The .xcodeproj is generated output and is not committed.
name: NosoDeck
options:
  bundleIdPrefix: com.noso.nosodeck
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  DeckKit:
    # The shared package lives at the repo root.
    path: ../..

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set DEVELOPMENT_TEAM in Xcode (or a local .xcconfig); intentionally unset here so
    # the spec stays owner-agnostic. Bundle-ID root is a placeholder until confirmed.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  NosoDeck:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: DeckKit
        product: DeckKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noso.nosodeck.ios
        PRODUCT_NAME: NosoDeck
        # iPhone only in v1; iPad reuses the iPhone layout (D6).
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NosoDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # v1 is landscape-primary; portrait is undesigned (D14, FR-23).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        # Dark-appearance only in v1; light mode is not yet designed.
        UIUserInterfaceStyle: Dark
        # Local-network discovery of the Mac agent (FR-1, FR-24).
        NSLocalNetworkUsageDescription:
          NosoDeck uses the local network to find and control your Mac. Nothing leaves
          your Wi-Fi and there is no account or cloud service.
        NSBonjourServices:
          - _nosodeck._tcp
        ITSAppUsesNonExemptEncryption: false
