# XcodeGen spec for the NosoDeck iPhone app (PRD §5).
# Generate with:  cd apps/NosoDeck && xcodegen
# The .xcodeproj is generated output and is not committed.
name: NosoDeck
options:
  bundleIdPrefix: com.noso.nosodeck
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

packages:
  DeckKit:
    # The shared package lives at the repo root.
    path: ../..

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8U4W79ZJ6G
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  NosoDeck:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Transport code both apps need, but which cannot live in DeckKit because it
      # imports Network and CryptoKit and DeckKit must stay Linux-clean.
      - path: ../Shared
    dependencies:
      - package: DeckKit
        product: DeckKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noso.nosodeck.ios
        PRODUCT_NAME: NosoDeck
        # iPhone only in v1; iPad reuses the iPhone layout (D6).
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NosoDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Portrait orientation — landscape content rendered rotated inside.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        # Dark-appearance only in v1; light mode is not yet designed.
        UIUserInterfaceStyle: Dark
        # Voice-to-Mac dictation
        NSSpeechRecognitionUsageDescription:
          NosoDeck uses speech recognition to type your voice into your Mac.
          Recognition runs on-device.
        NSMicrophoneUsageDescription:
          NosoDeck uses the microphone for voice dictation to your Mac.
        # Local-network discovery of the Mac agent (FR-1, FR-24).
        NSLocalNetworkUsageDescription:
          NosoDeck uses the local network to find and control your Mac. Nothing leaves
          your Wi-Fi and there is no account or cloud service.
        NSBonjourServices:
          - _nosodeck._tcp
        ITSAppUsesNonExemptEncryption: false
